<!DOCTYPE html>
<html>
<head>
    <title>New Order Received</title>
</head>
<body>
    <p>A new order has been received.</p>
    <p><strong>Order ID:</strong> #{{orderId}}</p>
    <p><strong>Customer Name:</strong> {{customerName}}</p>

    <p><a href="https://{{domain}}/secret-dashboard">Admin Panel</a></p>
</body>
</html>
