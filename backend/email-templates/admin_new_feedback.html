<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Customer Feedback</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
  .container { max-width: 600px; margin: 40px auto; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .header { background-color: #10B981; padding: 24px; text-align: center; }
  .header h1 { color: white; margin: 0; font-size: 24px; font-weight: bold; }
  .content { padding: 32px; color: #374151; line-height: 1.6; }
  .feedback-box { background-color: #f9fafb; padding: 20px; border-radius: 6px; margin-top: 20px; border-left: 4px solid #10B981; }
  .rating { font-size: 1.2em; font-weight: bold; color: #fbbf24; }
  .button { display: inline-block; background-color: #10B981; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: 600; margin-top: 24px; }
  .footer { background-color: #f9fafb; padding: 24px; text-align: center; color: #9ca3af; font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>KalyeKart Admin</h1>
    </div>
    <div class="content">
       <h2>New Feedback Received</h2>
       <p><strong>{{customerName}}</strong> has submitted new feedback.</p>

       <div class="feedback-box">
           <p><strong>Rating:</strong> <span class="rating">{{rating}} / 5</span></p>
           <p><strong>Comments:</strong></p>
           <p style="font-style: italic;">"{{feedback}}"</p>
       </div>

       <div style="text-align: center;">
           <a href="https://{{domain}}/admin/feedback" class="button">View Feedback</a>
       </div>
    </div>
    <div class="footer">
      <p>&copy; {{currentYear}} KalyeKart System.</p>
    </div>
  </div>
</body>
</html>
