<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Customer Feedback</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; background-color: #f4f4f4; }
        .container { width: 100%; max-width: 600px; margin: 20px auto; padding: 20px; border-radius: 5px; background-color: #ffffff; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .header { text-align: center; padding-bottom: 15px; border-bottom: 2px solid #0056b3; }
        .header h1 { margin: 0; color: #0056b3; font-size: 24px; }
        .content { padding: 20px 0; }
        .feedback-box { background-color: #f8f9fa; padding: 15px; border-left: 4px solid #ffc107; margin-bottom: 20px; }
        .feedback-box p { margin: 5px 0; }
        .rating { font-size: 18px; color: #ffc107; }
        .button-container { text-align: center; margin-top: 25px; }
        .button { background-color: #007bff; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; font-size: 16px; }
        .footer { text-align: center; padding-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>New Customer Feedback</h1>
        </div>
        <div class="content">
            <p>A new piece of feedback has been submitted by a customer.</p>

            <div class="feedback-box">
                <p><strong>From:</strong> {{customerName}}</p>
                <p><strong>Rating:</strong> <span class="rating">{{rating}} / 5</span></p>
                <p><strong>Feedback:</strong></p>
                <p><i>"{{feedback}}"</i></p>
            </div>

            <div class="button-container">
                <a href="https://{{domain}}/secret-dashboard" class="button">View in Dashboard</a>
            </div>
        </div>
        <div class="footer">
            <p>This is an automated notification from the KalyeKart System.</p>
        </div>
    </div>
</body>
</html>
