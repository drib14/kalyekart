<!DOCTYPE html>
<html>
<head>
    <title>New Refund Request</title>
</head>
<body>
    <p>A new refund request has been submitted for an order.</p>
    <p><strong>Order ID:</strong> #{{orderId}}</p>
    <p><strong>Customer Name:</strong> {{customerName}}</p>
    <p><strong>Reason for Refund:</strong></p>
    <p>"{{reason}}"</p>
    <p>Please log in to the admin panel to review the request and take action.</p>
    <p><a href="https://{{domain}}/secret-dashboard/refunds">View Refund Requests</a></p>
</body>
</html>
