<!DOCTYPE html>
<html>
<head>
    <title>Order Status Update</title>
</head>
<body>
    <p>Hi {{customerName}},</p>
    <p>The status of your order #{{orderId}} has been updated to: <strong>{{newStatus}}</strong>.</p>
    <p>You can view your order details here: <a href="https://{{domain}}/order/{{orderId}}">View Order</a></p>
    <p>Thank you for shopping with <a href="https://{{domain}}">kalyekart.app</a>!</p>
</body>
</html>
