<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Feedback</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 5px; text-align: center; }
        .header { padding-bottom: 20px; border-bottom: 1px solid #ddd; }
        .header h1 { margin: 0; color: #0056b3; }
        .content { padding: 30px 0; }
        .content p { font-size: 18px; }
        .button-container { margin-top: 20px; }
        .button { background-color: #007bff; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-size: 16px; }
        .footer { text-align: center; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>KalyeKart</h1>
        </div>
        <div class="content">
            <h2>Thank You, {{customerName}}!</h2>
            <p>We've received your feedback and truly appreciate you taking the time to share your thoughts. Your input helps us improve our service.</p>
            <div class="button-container">
                <a href="https://{{domain}}" class="button">Continue Shopping</a>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2024 KalyeKart. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
