<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Status Update</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e9e9e9;
        }
        .header {
            background-color: #17a2b8; /* Info color */
            color: #ffffff;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
        }
        .content {
            padding: 40px 30px;
            line-height: 1.8;
            font-size: 16px;
        }
        .content h2 {
            font-size: 24px;
            color: #17a2b8;
            margin-top: 0;
        }
        .status-update {
            background-color: #f8f9fa;
            border-left: 5px solid #17a2b8;
            padding: 20px;
            margin: 25px 0;
            border-radius: 8px;
            text-align: center;
        }
        .status-text {
            font-size: 20px;
            font-weight: 700;
            color: #343a40;
        }
        .cta-button {
            display: inline-block;
            padding: 15px 35px;
            background-color: #17a2b8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        .cta-button:hover {
            background-color: #138496;
        }
        .button-wrapper {
            text-align: center;
        }
        .footer {
            background-color: #f8f9fa;
            color: #888;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            border-top: 1px solid #e9e9e9;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>Order Status Updated</h1>
        </div>
        <div class="content">
            <h2>Admin FYI: The status of an order has been changed.</h2>
            <p>This is an automated notification to keep you informed of order progress.</p>

            <div class="status-update">
                <p style="margin-bottom: 10px;">Order <strong>#{{ORDER_ID}}</strong> is now:</p>
                <p class="status-text">{{NEW_STATUS}}</p>
            </div>

            <div class="button-wrapper">
                <a href="{{CTA_LINK}}" class="cta-button">View Order</a>
            </div>
        </div>
        <div class="footer">
            <p>This is an automated notification from the KalyeKart system.</p>
        </div>
    </div>
</body>
</html>
