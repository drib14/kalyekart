<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New User Registration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #e9e9e9;
        }
        .header {
            background-color: #28a745; /* Success color */
            color: #ffffff;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
        }
        .content {
            padding: 40px 30px;
            line-height: 1.8;
            font-size: 16px;
        }
        .content h2 {
            font-size: 24px;
            color: #28a745;
            margin-top: 0;
        }
        .info-box {
            background-color: #f8f9fa;
            border-left: 5px solid #28a745;
            padding: 20px;
            margin: 25px 0;
            border-radius: 8px;
        }
        .info-box p {
            margin: 5px 0;
        }
        .footer {
            background-color: #f8f9fa;
            color: #888;
            padding: 30px;
            text-align: center;
            font-size: 12px;
            border-top: 1px solid #e9e9e9;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>New User Joined!</h1>
        </div>
        <div class="content">
            <h2>Admin FYI: A new user has registered on KalyeKart.</h2>

            <div class="info-box">
                <p><strong>User Name:</strong> {{USER_NAME}}</p>
                <p><strong>User Email:</strong> {{USER_EMAIL}}</p>
            </div>

            <p>No action is required. This is just for your records.</p>
        </div>
        <div class="footer">
            <p>This is an automated notification from the KalyeKart system.</p>
        </div>
    </div>
</body>
</html>
