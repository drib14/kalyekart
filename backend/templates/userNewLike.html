<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Someone Liked Your Comment!</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 90%; max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .header { background-color: #f4f4f4; padding: 10px; text-align: center; border-bottom: 1px solid #ddd; }
        .content { padding: 20px 0; }
        .footer { text-align: center; font-size: 0.9em; color: #777; margin-top: 20px; }
        .button { background-color: #059669; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Great News!</h2>
        </div>
        <div class="content">
            <p>Hi {{NAME}},</p>
            <p><strong>{{ACTOR_NAME}}</strong> liked your {{LIKED_ENTITY}} on the product: <strong>{{PRODUCT_NAME}}</strong>.</p>
            <p>Keep the great feedback coming! You can see the comment thread by clicking the button below.</p>
            <a href="{{CTA_LINK}}" class="button">View Comment</a>
        </div>
        <div class="footer">
            <p>&copy; {{YEAR}} KalyeKart. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
